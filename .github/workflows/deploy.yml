name: CI & Auto-Deploy (Cloudflare Workers + D1)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: T1 Gate + S4 QA E2E + Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run T1 Deterministic Gate (wms-check.sh)
        run: bash scripts/wms-check.sh --quiet

      - name: Run S4 E2E QA Verification (wms-qa-verify.py --ci)
        run: python3 -I scripts/wms-qa-verify.py --ci

      - name: Build Static Assets Bundle (dist/site)
        run: python3 -I scripts/wms-build-deploy.py

  deploy:
    name: Deploy to Cloudflare Workers + D1
    runs-on: ubuntu-latest
    needs: [verify]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: production-deploy-main
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build Static Assets Bundle (dist/site)
        run: python3 -I scripts/wms-build-deploy.py

      - name: Configure Cloudflare Credentials
        env:
          CF_API_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_WRANGLER_CONFIG_SECRET: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CF_ACCOUNT_ID_SECRET:-76cf12a5975b729026f1b1dd89005e53}"
          echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          if [ -n "${CF_API_TOKEN_SECRET:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=${CF_API_TOKEN_SECRET}" >> "$GITHUB_ENV"
            echo "Configured Cloudflare authentication via CLOUDFLARE_API_TOKEN secret."
          else
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret. Wrangler v4 in non-interactive CI requires CLOUDFLARE_API_TOKEN (template 'Edit Cloudflare Workers' + 'Account -> D1 -> Edit') because OAuth refresh tokens in CLOUDFLARE_WRANGLER_CONFIG are single-use/rotating and expire after one refresh."
            exit 1
          fi

      - name: Apply D1 Schema Idempotently (cloudflare/schema.sql)
        run: |
          SQL_CMD=$(grep -v '^[[:space:]]*--' cloudflare/schema.sql | tr '\n' ' ')
          npx --yes wrangler@4 d1 execute where-money-sleeps-db --remote --command="$SQL_CMD" --yes

      - name: Deploy Worker & Static Assets to Production
        run: npx --yes wrangler@4 deploy

      - name: Verify Live Production Endpoints
        run: |
          set -euo pipefail
          LIVE_URL="https://where-money-sleeps.duypham9895.workers.dev"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$LIVE_URL/" -o /tmp/live-index.html
          grep -q "const STORIES" /tmp/live-index.html
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$LIVE_URL/studio.html" -o /tmp/live-studio.html
          grep -q "WMS Review Studio" /tmp/live-studio.html
          HTTP_CODE=$(curl -s --retry 5 --retry-delay 2 --retry-all-errors -o /dev/null -w "%{http_code}" -X POST "$LIVE_URL/api/p" \
            -H "Content-Type: text/plain" \
            -d '{"event":"ci_smoke_ping"}')
          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Expected HTTP 204 from POST $LIVE_URL/api/p, got $HTTP_CODE"
            exit 1
          fi
          CUSTOM_HOST="wheremoneysleeps.duyslab.icu"
          for i in {1..12}; do
            if getent hosts "$CUSTOM_HOST" >/dev/null 2>&1; then
              CUSTOM_CODE=$(curl -sS --retry 5 --retry-delay 3 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://$CUSTOM_HOST/" || true)
              echo "Custom domain https://$CUSTOM_HOST/ status: $CUSTOM_CODE"
              if [ "$CUSTOM_CODE" = "200" ]; then break; fi
            fi
            echo "Waiting for DNS/TLS propagation on $CUSTOM_HOST (attempt $i/12)..."
            sleep 5
          done
          echo "Verified live endpoints on $LIVE_URL and custom domain $CUSTOM_HOST."
