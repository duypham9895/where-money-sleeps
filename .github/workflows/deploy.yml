name: CI & Auto-Deploy (Cloudflare Workers + D1)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: T1 Gate + S4 QA E2E + Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify Entry Parity (docs/prototype.html == index.html)
        run: cmp -s docs/prototype.html index.html || diff -u index.html docs/prototype.html

      - name: Verify Review Studio Data Sync (wms-studio-sync --verify)
        run: python3 -I scripts/wms-studio-sync.py --verify

      - name: Run T1 Deterministic Gate (wms-check.sh)
        run: bash scripts/wms-check.sh --quiet

      - name: Run S4 E2E QA Verification (wms-qa-verify.py --ci)
        run: python3 -I scripts/wms-qa-verify.py --ci

      - name: Build Static Assets Bundle (dist/site)
        run: python3 -I scripts/wms-build-deploy.py

  deploy:
    name: Deploy to Cloudflare Workers + D1
    runs-on: ubuntu-latest
    needs: [verify]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: production-deploy-main
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Sync Review Studio Data (wms-studio-sync)
        run: python3 -I scripts/wms-studio-sync.py

      - name: Build Static Assets Bundle (dist/site)
        run: python3 -I scripts/wms-build-deploy.py

      - name: Configure Cloudflare Credentials
        env:
          CF_API_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_WRANGLER_CONFIG_SECRET: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CF_ACCOUNT_ID_SECRET:-76cf12a5975b729026f1b1dd89005e53}"
          echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          if [ -n "${CF_API_TOKEN_SECRET:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=${CF_API_TOKEN_SECRET}" >> "$GITHUB_ENV"
            echo "Configured Cloudflare authentication via CLOUDFLARE_API_TOKEN secret."
          else
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret. Wrangler v4 in non-interactive CI requires CLOUDFLARE_API_TOKEN (template 'Edit Cloudflare Workers' + 'Account -> D1 -> Edit') because OAuth refresh tokens in CLOUDFLARE_WRANGLER_CONFIG are single-use/rotating and expire after one refresh."
            exit 1
          fi

      - name: Apply D1 Schema Idempotently (cloudflare/schema.sql)
        run: |
          SQL_CMD=$(grep -v '^[[:space:]]*--' cloudflare/schema.sql | tr '\n' ' ')
          npx --yes wrangler@4 d1 execute where-money-sleeps-db --remote --command="$SQL_CMD" --yes

      - name: Deploy Worker & Static Assets to Production
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee /tmp/wrangler-deploy.log
          grep -q "https://where-money-sleeps.duypham9895.workers.dev" /tmp/wrangler-deploy.log
          grep -q "wheremoneysleeps.duyslab.icu (custom domain)" /tmp/wrangler-deploy.log

      - name: Verify Live Production Endpoints
        run: |
          set -euo pipefail
          WORKERS_URL="https://where-money-sleeps.duypham9895.workers.dev"
          CUSTOM_URL="https://wheremoneysleeps.duyslab.icu"
          CUSTOM_HOST="wheremoneysleeps.duyslab.icu"

          ROUTES=(
            "/"
            "/prototype.html"
            "/workflows.html"
            "/studio.html"
            "/wms-studio-data.js"
            "/duyslab-overview.html"
            "/llm-quiz.html"
            "/studio-mockups.html"
            "/landing-detail-mockups.html"
            "/mockup-option-a.html"
            "/mockup-option-b.html"
            "/s0.html"
            "/s1.html"
            "/s2.html"
            "/s3.html"
            "/s4.html"
            "/s5.html"
            "/s6.html"
            "/gates/06-iterate/TRIAGE.md"
            "/gates/06-iterate/READOUT.md"
            "/public/audio/beats-manifest.json"
            "/public/brand/card-fig-1.jpg"
            "/legal/licences.json"
            "/legal/tt99-phu-luc-ii.secondary.json"
            "/dist/youtube/card-long-16x9.srt"
            "/favicon.svg"
            "/robots.txt"
            "/sitemap.xml"
          )

          verify_origin() {
            local ORIGIN="$1"
            echo "=== Verifying $ORIGIN ==="
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -A "WMS-CI-Verify/1.0" "$ORIGIN/" -o /tmp/live-index.html
            grep -q "const STORIES" /tmp/live-index.html
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -A "WMS-CI-Verify/1.0" "$ORIGIN/prototype.html" -o /tmp/live-proto.html
            grep -q "const STORIES" /tmp/live-proto.html
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -A "WMS-CI-Verify/1.0" "$ORIGIN/studio.html" -o /tmp/live-studio.html
            grep -q "WMS Review Studio" /tmp/live-studio.html

            for path in "${ROUTES[@]}"; do
              CODE=$(curl -sSL --retry 3 --retry-delay 2 -A "WMS-CI-Verify/1.0" -o /dev/null -w "%{http_code}" "$ORIGIN$path")
              if [ "$CODE" != "200" ]; then
                echo "::error::Expected HTTP 200 for $ORIGIN$path, got $CODE"
                exit 1
              fi
              echo "  OK 200 $ORIGIN$path"
            done

            BEACON_CODE=$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors -A "WMS-CI-Verify/1.0" -o /dev/null -w "%{http_code}" -X POST "$ORIGIN/api/p" \
              -H "Content-Type: text/plain" \
              -d '{"event":"ci_smoke_ping"}')
            if [ "$BEACON_CODE" != "204" ]; then
              echo "::error::Expected HTTP 204 from POST $ORIGIN/api/p, got $BEACON_CODE"
              exit 1
            fi
            echo "  OK 204 POST $ORIGIN/api/p"

            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -A "WMS-CI-Verify/1.0" "$ORIGIN/?story=profitcash&lang=en" -o /tmp/live-og.html
            grep -q "profitcash-fig-1.jpg" /tmp/live-og.html
            echo "  OK HTMLRewriter OG meta $ORIGIN/?story=profitcash&lang=en"

            FB_CODE=$(curl -sS --retry 3 --retry-delay 2 -A "WMS-CI-Verify/1.0" -o /dev/null -w "%{http_code}" -X POST "$ORIGIN/api/feedback" -d '{}')
            if [ "$FB_CODE" != "410" ]; then
              echo "::error::Expected HTTP 410 from POST $ORIGIN/api/feedback, got $FB_CODE"
              exit 1
            fi
            echo "  OK 410 POST $ORIGIN/api/feedback"
          }

          verify_origin "$WORKERS_URL"

          if ! getent hosts "$CUSTOM_HOST" >/dev/null 2>&1; then
            echo "::error::DNS lookup failed for custom domain $CUSTOM_HOST"
            exit 1
          fi

          CUSTOM_CODE=$(curl -sSL --max-time 20 -D /tmp/custom-hdr.txt -o /dev/null -w "%{http_code}" -A "WMS-CI-Verify/1.0" "$CUSTOM_URL/" || true)
          if [ "$CUSTOM_CODE" = "200" ]; then
            verify_origin "$CUSTOM_URL"
          elif [ "$CUSTOM_CODE" = "403" ] && grep -qi "^cf-ray:" /tmp/custom-hdr.txt; then
            echo "  OK custom domain $CUSTOM_URL reachable at Cloudflare edge (cf-ray verified; HTTP 403 Bot Fight Mode on Azure runner IP; custom domain trigger verified via wrangler deploy)"
          else
            echo "::error::Unexpected status $CUSTOM_CODE from $CUSTOM_URL"
            exit 1
          fi
